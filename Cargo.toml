[workspace]
resolver = "3"
members = ["crates/idm-core", "crates/idm-cli", "crates/idm-ipc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
idm-core = { path = "crates/idm-core" }
tokio = { version = "1", default-features = false }
reqwest = { version = "0.13", features = ["stream", "socks"] }      # 保持默认 TLS；禁止开启 gzip/brotli/zstd/deflate
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
bytes = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
