[package]
name = "idm-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# 仅供集成测试使用的 host 自测钩子（panic 注入）。默认关闭，
# 因此 release / 默认构建不含 `IDM_NMHOST_TEST_PANIC` 读取逻辑与注入点。
default = []
test-hooks = []

[dependencies]
idm-core = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "idm-nmhost"
path = "src/bin/idm-nmhost.rs"
